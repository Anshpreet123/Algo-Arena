# Infrastructure for local development.
#
# Judge0 used to live here. It required privileged containers and cgroup v1,
# which Docker Desktop no longer provides, so code execution moved to
# apps/judge — a service that starts one locked-down container per submission.
# Nothing in this file needs privileged mode any more.

services:
  db:
    image: postgres:16-alpine
    container_name: arena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRES_DB: algo-arena
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arena-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--requirepass', 'supersecurepassword']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'supersecurepassword', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cache:/data

volumes:
  postgres_data:
  cache:
    driver: local
